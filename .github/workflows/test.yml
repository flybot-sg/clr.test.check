name: test

# Only the Magic port branch needs CI. `master` mirrors
# clojure/clr.test.check upstream and is not exercised here.
on:
  push:
    branches: [magic]
  pull_request:
    branches: [magic]

jobs:
  clr-test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flybot-sg/ci-clj-clr:2.5.0
    steps:
      - uses: actions/checkout@v6

      # nostrand 0.5.0 honours GITLIBS (cloning under $GITLIBS/nostrand/),
      # so pointing it at ~/.gitlibs reuses the cache block below. Set via
      # GITHUB_ENV because job-level `env:` cannot expand $HOME, and both
      # nostrand and tools.deps read the var literally.
      - name: Point GITLIBS at the cached dir
        run: echo "GITLIBS=$HOME/.gitlibs" >> "$GITHUB_ENV"

      - name: Cache JVM dependency stores
        uses: actions/cache@v5
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.cpcache
          key: ${{ runner.os }}-deps-${{ hashFiles('deps.edn', 'bb.edn') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Tool versions
        run: |
          nos version || true
          bb --version || true

      - name: Run CLR test suite via Nostrand/Magic
        run: bb clr-test
